name: Nightly database backup

# Dumps the Supabase database every night, encrypts it with a passphrase only
# Matthew knows, and keeps the last 30 nights as assets of a "backups" release
# in this repository. Free: GitHub Actions minutes and release storage.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL    the "Session pooler" connection string from Supabase
#                      (Connect → Session pooler), with the database password in it
#   BACKUP_PASSPHRASE  a long passphrase; without it the backups cannot be opened
# Until both are set, and while the repository is public, the job does nothing
# and says so. See docs/backups.md.

on:
  schedule:
    - cron: '30 7 * * *' # 03:30 in Toronto (EDT), 02:30 in winter
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the secrets are set
        id: ready
        run: |
          private=$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)
          if [ "$private" != "true" ]; then
            # Release files of a public repository can be downloaded by anyone.
            echo "::warning::This repository is public, so backups stay off. Make it private first (see docs/backups.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::notice::Backups are not set up yet: add SUPABASE_DB_URL and BACKUP_PASSPHRASE (see docs/backups.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.ready.outputs.ok == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.ready.outputs.ok == 'true'
        with:
          version: latest

      - name: Dump roles, schema and data
        if: steps.ready.outputs.ok == 'true'
        run: |
          mkdir -p dump
          supabase db dump --db-url "$SUPABASE_DB_URL" -f dump/roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f dump/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f dump/data.sql --use-copy --data-only
          ls -la dump

      - name: Encrypt
        if: steps.ready.outputs.ok == 'true'
        run: |
          name="choirbook-$(date -u +%Y-%m-%d).tar.gz.gpg"
          tar -czf - -C dump . | gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_PASSPHRASE" -o "$name"
          rm -rf dump
          echo "BACKUP_FILE=$name" >> "$GITHUB_ENV"

      - name: Upload to the backups release and keep the last 30
        if: steps.ready.outputs.ok == 'true'
        run: |
          gh release view backups >/dev/null 2>&1 || \
            gh release create backups --title "Database backups (encrypted)" --notes "Nightly encrypted backups. See docs/backups.md to restore." --prerelease
          gh release upload backups "$BACKUP_FILE" --clobber
          gh release view backups --json assets --jq '.assets | sort_by(.createdAt) | reverse | .[30:] | .[].name' | \
            while read -r old; do gh release delete-asset backups "$old" --yes; done
