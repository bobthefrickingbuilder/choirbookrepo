    const scrollTop = () => p.scrollTop?.();
    const voiceLabel = (X.voices.find((x) => x[0] === s.voice) || [])[1];
    const gradeLabel = (X.grades.find((g) => g[0] === s.v.grade) || [])[1] || '';
    const cFirst = s.v.cFirst || 'Your chorister';
    return {
      X, lang, v: s.v, on, err: s.err,
      pad: mobile ? '20px 16px 32px' : '36px 24px 48px', cardPad: mobile ? '20px 16px' : '28px 32px',
      h1: mobile ? '30px' : 'var(--text-display-l)', inputSize: mobile ? 'lg' : 'md',
      hStart: h(NS.ChoirLogo, { name: 'Ottawa Regional Youth Choir', shortName: 'ORYC', size: mobile ? 28 : 32, hideName: false }),
      hEnd: h('span', { style: { display: 'flex', alignItems: 'center', gap: 8 } },
        h(NS.SegmentedControl, { label: 'Language', value: lang, onChange: (l) => p.setLang?.(l), options: [{ value: 'en', label: 'EN' }, { value: 'fr', label: 'FR' }] }),
        mobile ? null : h(NS.Button, { size: 'sm', variant: 'ghost', onClick: () => p.go?.('login') }, X.signIn)),
      notDone: !s.done, done: s.done,
      steps: X.steps.map((label) => ({ label })), step: s.step,
      goStep: (i) => { if (i < s.step) this.setState({ step: i }); },
      s0: s.step === 0, s1: s.step === 1, s2: s.step === 2, s3: s.step === 3, s4: last,
      relOptions: X.rel.map((r) => ({ value: r, label: r })),
      second: s.second, toggleSecond: (e) => this.setState({ second: e.target.checked }),
      voice: s.voice, setVoice: (val) => this.setState({ voice: val }),
      voiceOptions: X.voices.map(([value, label, description]) => ({ value, label, description })),
      gradeOptions: X.grades.map(([value, label]) => ({ value, label })),
      consent: s.consent, toggleConsent: (e) => this.setState({ consent: e.target.checked }),
      review: [
        [X.rv[0], `${s.v.cFirst} ${s.v.cLast}`.trim() + (s.v.cEmail ? ` · ${s.v.cEmail}` : '')],
        [X.rv[1], s.v.cDob || '—'],
        [X.rv[2], `${s.v.gName || '—'}${s.v.gPhone ? ' · ' + s.v.gPhone : ''}`],
        [X.rv[3], s.voice === 'N' ? X.notSure : voiceLabel],
        [X.rv[4], [s.v.school, gradeLabel].filter(Boolean).join(' · ') || '—'],
        [X.rv[5], `${s.v.eName || '—'}${s.v.ePhone ? ' · ' + s.v.ePhone : ''}`],
      ].map(([k, val]) => ({ k, v: val })),
      backBtn: s.step > 0 ? h(NS.Button, { variant: 'secondary', size: 'lg', iconStart: 'arrow-left', onClick: () => { this.setState({ step: s.step - 1 }); scrollTop(); } }, X.back) : null,
      nextLabel: last ? X.submit : X.continue,
      nextIcon: last ? undefined : 'arrow-right', submitIcon: last ? 'send' : undefined,
      next: () => {
        const err = validate();
        if (Object.keys(err).length) { this.setState({ err }); return; }
        this.setState(last ? { done: true, err: {} } : { step: s.step + 1, err: {} });
        scrollTop();
      },
      fillSample: () => this.setState({ v: { ...SAMPLE }, err: {} }),
      doneTitle: X.doneTitle(cFirst), doneBody: X.doneBody((s.v.gName || '').split(' ')[0] || 'there', s.v.gEmail || 'your email'),
      nextSteps: [
        { num: '1', bt: 'transparent', title: X.n1t, body: X.n1b(cFirst) },
        { num: '2', bt: 'var(--border-subtle)', title: X.n2t, body: X.n2b },
        { num: '3', bt: 'var(--border-subtle)', title: X.n3t, body: X.n3b },
      ],
      calLabel: s.cal ? X.added : X.addCal, calIcon: s.cal ? 'calendar-check' : 'plus', calVariant: s.cal ? 'tonal' : 'primary',
      addCal: () => this.setState({ cal: true }),
      goLogin: () => p.go?.('login'),
    };
  }
}
</script>
</body>
</html>
